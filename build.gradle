plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.139'
    id 'idea'
}


tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

group = project.maven_group
version = project.mod_version

base {
    archivesName = project.archives_base_name
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

repositories {
    mavenCentral()
    maven {
        name = "NeoForged"
        url = "https://maven.neoforged.net/releases"
    }
//    maven { url "https://maven.shedaniel.me/" }
//    maven { url "https://maven.terraformersmc.com/" }
}

dependencies {
    // MC 26.2 编译期依赖：moddev 2.0.139 暂不识别 MC 26.2（fallback 到 26.1），需手动声明；升级 moddev 后应能移除
    implementation 'org.joml:joml:1.10.8'
    implementation 'org.jspecify:jspecify:1.0.0'
    implementation 'it.unimi.dsi:fastutil:8.5.18'
    implementation 'com.mojang:brigadier:1.3.10'
}

neoForge {
    version = project.neo_version


    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }


var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version       : minecraft_version,
            minecraft_version_range : minecraft_version_range,
            neo_version             : neo_version,
            neo_version_low         : neo_version_low,
            loader_version_range    : loader_version_range,
            mod_id                  : mod_id,
            mod_name                : mod_name,
            mod_license             : mod_license,
            mod_version             : mod_version,
    ]

    inputs.properties replaceProperties
    expand replaceProperties

    from("src/main/templates")
    into(layout.buildDirectory.dir("generated/sources/modMetadata"))
}

sourceSets.main.resources.srcDir generateModMetadata

neoForge.ideSyncTask generateModMetadata


// ensure that the encoding is set to UTF-8, no matter what the system default is
// this fixes some edge cases with special characters not displaying correctly
// see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 25
}

tasks.named("jar") {
    archiveFileName.set(
            "torohealth-continued-neoforge-${minecraft_version}-${mod_version}.jar"
    )
}


idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// configure the maven publication

